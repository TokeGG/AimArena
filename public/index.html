<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim Arena</title>
<style>
  :root { --blue:#3b82ff; --red:#ff5436; --ally:#4ade80; --ink:#e8ecff; --dim:#8b97c7; --panel:rgba(12,17,34,.84); --line:#2a3560; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0f1e; color:var(--ink);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hidden { display:none !important; }

  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(6,9,20,.55); backdrop-filter:blur(4px); z-index:20; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px 30px; width:min(580px,92vw); }
  h1 { margin:0 0 4px; font-size:30px; letter-spacing:.04em; }
  h1 span { color:var(--blue); }
  .sub { color:var(--dim); margin:0 0 18px; font-size:14px; }
  label.f { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:14px 0 6px; }
  input[type=text] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0b1226; color:var(--ink); font-size:16px; }
  input[type=range] { width:100%; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  button { cursor:pointer; font:inherit; color:var(--ink); background:#16204a; border:1px solid var(--line); border-radius:8px; padding:11px 14px; }
  button:hover { border-color:#4a5fb0; }
  button.on { background:#1f3a86; border-color:var(--blue); }
  button.primary { background:var(--blue); border-color:var(--blue); font-weight:700; font-size:17px; width:100%; margin-top:20px; padding:13px; }
  button.primary:disabled { opacity:.4; cursor:not-allowed; }
  .spells { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .spellcard { text-align:left; }
  .spellcard b { display:block; margin-bottom:3px; }
  .spellcard small { color:var(--dim); font-size:12px; line-height:1.3; display:block; }
  .keys { color:var(--dim); font-size:12px; margin-top:14px; line-height:1.6; }
  .keys kbd { background:#16204a; border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--ink); }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #topbar { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:14px; }
  .sc { min-width:54px; text-align:center; font-size:30px; font-weight:800; padding:2px 12px; border-radius:8px; background:var(--panel); border:2px solid transparent; }
  .sc.blue { color:var(--blue); } .sc.red { color:var(--red); }
  .sc.mine { border-color:var(--ally); }
  #mid { text-align:center; min-width:90px; }
  #timer { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  #rd { font-size:11px; letter-spacing:.12em; color:var(--dim); }
  #roster { position:absolute; top:12px; left:12px; font-size:13px; background:var(--panel); border-radius:8px; padding:8px 10px; min-width:170px; }
  #roster .r { display:flex; align-items:center; gap:8px; margin:3px 0; }
  #roster .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #roster .bar { width:52px; height:6px; background:#222c52; border-radius:3px; overflow:hidden; }
  #roster .bar i { display:block; height:100%; }
  #roster .dead { opacity:.35; text-decoration:line-through; }
  #roster hr { border:0; border-top:1px solid var(--line); margin:6px 0; }
  #killfeed { position:absolute; top:12px; right:12px; text-align:right; font-size:14px; }
  #killfeed div { background:var(--panel); padding:4px 10px; border-radius:6px; margin-bottom:4px; }
  #banner { position:absolute; top:26%; left:0; right:0; text-align:center; font-size:64px; font-weight:900; letter-spacing:.06em; text-shadow:0 2px 20px rgba(0,0,0,.8); }
  #banner small { display:block; font-size:18px; font-weight:500; letter-spacing:.1em; color:var(--dim); }
  #crosshair { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px #000, 0 0 8px rgba(255,255,255,.4); }
  #hitm { position:absolute; left:50%; top:50%; width:28px; height:28px; margin:-14px 0 0 -14px; opacity:0; transition:opacity .15s; }
  #hitm::before, #hitm::after { content:""; position:absolute; left:50%; top:-4px; width:3px; height:36px; margin-left:-1.5px; background:#fff; box-shadow:0 0 4px #000; }
  #hitm::before { transform:rotate(45deg); } #hitm::after { transform:rotate(-45deg); }
  #hitm.on { opacity:1; transition:none; } #hitm.head::before, #hitm.head::after { background:#ff3b3b; }
  #flash { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 45%, rgba(255,30,30,.55)); opacity:0; transition:opacity .35s; }
  #flash.on { opacity:1; transition:none; }
  #spectate { position:absolute; bottom:22%; left:0; right:0; text-align:center; font-size:20px; letter-spacing:.2em; color:var(--dim); }
  #bl { position:absolute; left:20px; bottom:20px; width:240px; }
  #hpval { font-size:44px; font-weight:800; line-height:1; text-shadow:0 2px 8px rgba(0,0,0,.7); }
  #hpbar { height:10px; background:rgba(12,17,34,.8); border-radius:5px; overflow:hidden; margin-top:6px; border:1px solid var(--line); }
  #hpfill { height:100%; width:100%; background:var(--ally); transition:width .1s; }
  #spells { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); display:flex; gap:12px; }
  .spell { position:relative; width:92px; height:68px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; text-align:center; padding-top:8px; }
  .spell .key { font-size:12px; color:var(--dim); } .spell .nm { font-size:14px; font-weight:700; margin-top:4px; }
  .spell .cdo { position:absolute; left:0; right:0; bottom:0; height:0; background:rgba(0,0,0,.65); }
  .spell .cdt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; text-shadow:0 0 6px #000; }
  .spell.ready { border-color:var(--ally); }
  #ping { position:absolute; right:12px; bottom:10px; font-size:12px; color:var(--dim); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <div id="scB" class="sc blue">0</div>
    <div id="mid"><div id="timer">1:30</div><div id="rd">ROUND 1</div></div>
    <div id="scR" class="sc red">0</div>
  </div>
  <div id="roster"></div>
  <div id="killfeed"></div>
  <div id="banner"></div>
  <div id="crosshair"></div><div id="hitm"></div><div id="flash"></div>
  <div id="spectate" class="hidden">SPECTATING</div>
  <div id="bl"><div id="hpval">100</div><div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="spells"></div>
  <div id="ping"></div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>AIM <span>ARENA</span></h1>
    <p class="sub">Team arena shooter with abilities. Bots fill any empty slots.</p>

    <label class="f" for="name">Name</label>
    <input id="name" type="text" maxlength="14" autocomplete="off">

    <label class="f">Mode</label>
    <div class="row"><button id="m2">2 v 2</button><button id="m3">3 v 3</button></div>

    <label class="f">Pick two spells (Q and E)</label>
    <div class="spells" id="spellpick"></div>

    <label class="f" for="sens">Sensitivity <span id="sensv"></span></label>
    <input id="sens" type="range" min="0.2" max="3" step="0.05">

    <button id="play" class="primary">PLAY</button>
    <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>Mouse</kbd> aim &amp; shoot &nbsp; <kbd>Q</kbd> <kbd>E</kbd> spells &nbsp; <kbd>Esc</kbd> menu</div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card" style="text-align:center">
    <h1>PAUSED</h1>
    <p class="sub">The match keeps running on the server.</p>
    <div class="row"><button id="resume" class="primary" style="margin-top:6px">RESUME</button><button id="leave" style="margin-top:6px">Leave match</button></div>
  </div>
</div>

<div id="msg" class="overlay hidden">
  <div class="card" style="text-align:center"><h1 id="msgt">Disconnected</h1><p class="sub" id="msgs"></p><button class="primary" onclick="location.reload()">Back to menu</button></div>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
